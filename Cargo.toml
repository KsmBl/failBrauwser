[package]
name = "failbrauwser"
version = "0.8.1"
edition = "2024"
# What the GTK bindings need; install.sh sets up a newer Rust where the system's is older.
rust-version = "1.92"
description = "A fast, native GTK3 file manager that can browse and edit archives"
license = "GPL-3.0-or-later"

[[bin]]
name = "failbrauwser"
path = "src/main.rs"

[lib]
name = "failbrauwser"
path = "src/lib.rs"

[dependencies]
async-channel = "2"
gtk = { version = "0.19", features = ["v3_24"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
md-5 = "0.11"
sha2 = "0.11"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
# The program is built on 16 cores instead of one: about 40 s instead of 2.5 min for its last
# step, for a few percent of size.
codegen-units = 16
strip = true
